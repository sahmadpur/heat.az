<!-- Caspian Plaza has no brand asset — only the lettering on the building sign.
     This is that lettering set as a wordmark: serif caps, wide tracking. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 96" width="240" height="96" role="img" aria-label="Caspian Plaza">
  <g fill="#2f3a42" font-family="'Times New Roman', Times, Georgia, serif" font-size="34" letter-spacing="2.5" text-anchor="middle">
    <text x="120" y="42">CASPIAN</text>
    <text x="120" y="82">PLAZA</text>
  </g>
</svg>
