<!-- Dəmirçi Tower has no brand asset — only the lettering on the entrance sign.
     This is that lettering set as a wordmark: bold sans caps, wide tracking. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 96" width="240" height="96" role="img" aria-label="Dəmirçi Tower">
  <g fill="#8a4a2b" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="32" letter-spacing="1.5" text-anchor="middle">
    <text x="120" y="42">DEMIRCHI</text>
    <text x="120" y="82">TOWER</text>
  </g>
</svg>
